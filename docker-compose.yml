services:

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    mem_limit: 700m
    cpus: 0.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 5

  service-registry:
    container_name: service-registry
    image: chetan0172/service-registry:${IMAGE_TAG}
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    mem_limit: 600m
    cpus: 0.5
    ports:
      - "8761:8761"

  api-gateway:
    container_name: api-gateway
    image: chetan0172/api-gateway:${IMAGE_TAG}
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    mem_limit: 600m
    cpus: 0.5
    ports:
      - "8080:8080"
    depends_on:
      - service-registry

  user-service:
    container_name: user-service
    image: chetan0172/user-service:${IMAGE_TAG}
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    mem_limit: 600m
    cpus: 0.5
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  product-service:
    container_name: product-service
    image: chetan0172/product-service:${IMAGE_TAG}
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    mem_limit: 600m
    cpus: 0.5
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  order-service:
    container_name: order-service
    image: chetan0172/order-service:${IMAGE_TAG}
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    mem_limit: 600m
    cpus: 0.5
    ports:
      - "8083:8083"
    depends_on:
      - service-registry

volumes:
  mysql-data: