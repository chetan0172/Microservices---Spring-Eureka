name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build & Run Tests
      - name: Build & Run Tests
        run: mvn clean verify

      # 4️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 5️⃣ Build, Scan & Push Images
      - name: Build, Scan & Push Images
        run: |
          mkdir -p reports
          SERVICES="service-registry api-gateway user-service product-service order-service"

          for SERVICE in $SERVICES; do
            echo "🚀 Building $SERVICE..."

            docker build \
              -t $DOCKER_USER/$SERVICE:$IMAGE_TAG \
              -f $SERVICE/Dockerfile \
              .

            echo "🔎 Scanning $SERVICE with Trivy..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $(pwd)/reports:/reports \
              aquasec/trivy:latest image \
              --format sarif \
              --output /reports/trivy-$SERVICE.sarif \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 0 \
              $DOCKER_USER/$SERVICE:$IMAGE_TAG

            echo "📦 Pushing SHA tag..."
            docker push $DOCKER_USER/$SERVICE:$IMAGE_TAG

            echo "📦 Tagging and pushing latest..."
            docker tag $DOCKER_USER/$SERVICE:$IMAGE_TAG $DOCKER_USER/$SERVICE:latest
            docker push $DOCKER_USER/$SERVICE:latest
          done

      # 6️⃣ Upload Trivy SARIF Results
      - name: Upload Trivy SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-user-service.sarif

      # 7️⃣ Upload All Trivy Reports
      - name: Upload All Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: reports/*.sarif