name: CI - Build, Scan & Push Docker Images

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 1️⃣ Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build Project
      - name: Build with Maven
        run: mvn clean verify

      # 4️⃣ Login to DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 5️⃣ Build, Scan & Push
      - name: Build, Scan & Push Images
        run: |
          mkdir -p reports
          SERVICES="service-registry api-gateway user-service product-service order-service"

          for SERVICE in $SERVICES; do
            echo "🚀 Building $SERVICE..."

            docker build \
              -t $DOCKER_USER/$SERVICE:$IMAGE_TAG \
              -f $SERVICE/Dockerfile \
              .

            echo "🔎 Scanning with Trivy..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              $DOCKER_USER/$SERVICE:$IMAGE_TAG

            echo "📦 Pushing SHA tag..."
            docker push $DOCKER_USER/$SERVICE:$IMAGE_TAG

            # Tag based on branch
            if [ "${{ github.ref_name }}" = "dev" ]; then
              docker tag $DOCKER_USER/$SERVICE:$IMAGE_TAG $DOCKER_USER/$SERVICE:dev
              docker push $DOCKER_USER/$SERVICE:dev
            fi

            if [ "${{ github.ref_name }}" = "main" ]; then
              docker tag $DOCKER_USER/$SERVICE:$IMAGE_TAG $DOCKER_USER/$SERVICE:latest
              docker push $DOCKER_USER/$SERVICE:latest
            fi

          done