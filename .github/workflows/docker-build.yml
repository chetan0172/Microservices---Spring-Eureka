name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build & Run Tests
      - name: Build & Run Tests
        run: mvn clean verify

      # 4️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 5️⃣ Build, Scan & Push Images
      - name: Build, Scan & Push Images
        run: |
          SERVICES="service-registry api-gateway user-service product-service order-service"

          for SERVICE in $SERVICES; do
            echo "🚀 Building $SERVICE..."
            docker build -t $DOCKER_USER/$SERVICE:$IMAGE_TAG ./$SERVICE

            echo "🔎 Scanning $SERVICE with Trivy..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --exit-code 0 \
              --ignore-unfixed \
              $DOCKER_USER/$SERVICE:$IMAGE_TAG

            echo "📦 Pushing $SERVICE..."
            docker push $DOCKER_USER/$SERVICE:$IMAGE_TAG

            # Tag latest only for dev branch
            if [ "${{ github.ref_name }}" = "dev" ]; then
              docker tag $DOCKER_USER/$SERVICE:$IMAGE_TAG $DOCKER_USER/$SERVICE:latest
              docker push $DOCKER_USER/$SERVICE:latest
            fi

          done