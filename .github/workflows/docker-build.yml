name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Run Tests
        run: mvn clean verify

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Images
        run: |
          SERVICES="service-registry api-gateway user-service product-service order-service"

          for SERVICE in $SERVICES; do
            docker build -t $DOCKER_USER/$SERVICE:$IMAGE_TAG ./$SERVICE
            docker push $DOCKER_USER/$SERVICE:$IMAGE_TAG

            # Optional: Only tag latest for dev branch
            if [ "${{ github.ref_name }}" = "dev" ]; then
              docker tag $DOCKER_USER/$SERVICE:$IMAGE_TAG $DOCKER_USER/$SERVICE:latest
              docker push $DOCKER_USER/$SERVICE:latest
            fi
          done