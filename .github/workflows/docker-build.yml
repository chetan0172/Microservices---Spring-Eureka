name: Full CI/CD Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Maven Project
        run: mvn clean install -DskipTests

      # 🔹 Login to Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 🔹 Build & Push Images
      - name: Build and Push Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway ./api-gateway
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service ./product-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service ./order-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-service ./user-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/service-registry ./service-registry

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/service-registry

      # 🔹 Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu
            docker-compose pull
            docker-compose down
            docker-compose up -d